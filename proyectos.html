<!DOCTYPE html>
<!-- lang="es" le dice al navegador que la página está en español -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Adapta la página al ancho de la pantalla en celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Jair Cruz Arenas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Mis estilos. Van después de Bootstrap para poder sobrescribirlo.
         El ../ sube una carpeta porque este HTML está en una subcarpeta -->
    <link href="css/estilos.css" rel="stylesheet">

    <!-- Google Fonts. Los preconnect abren la conexión antes para que cargue más rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <!-- Kit de íconos (Font Awesome) -->
    <script src="https://kit.fontawesome.com/4d93aa050a.js" crossorigin="anonymous"></script>
</head>



<body>

<!-- ========== BARRA DE NAVEGACIÓN ========== -->
<!-- navbar-expand-md: el menú se ve completo desde pantallas medianas;
     en pantallas chicas se esconde detrás de la hamburguesa.
     sticky-top: la barra se queda fija arriba al hacer scroll -->
<nav class="navbar navbar-expand-md barra-navegacion sticky-top">
    <div class="container-fluid">

        <!-- Logo, enlace a la página de inicio -->
        <a class="navbar-brand fw-bold" href="index.html">
            <img src="assets/logo_corregido-removebg-preview.png" alt="Inicio" width="43" height="40">
        </a>

        <!-- Hamburguesa (solo en celular). data-bs-target debe coincidir con el id de abajo -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú que se esconde en celular -->
        <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
            <div class="contenedor-botones-navegacion">
                <a class="btn boton-navegacion" href="index.html#sobre-mi">Sobre mi</a>
                <a class="btn boton-navegacion" href="proyectos.html">Proyectos</a>
                <a class="btn boton-navegacion" href="contacto.html">Contacto</a>
                <a class="btn boton-navegacion" href="ixtlan.html">IXTLAN STEAMex</a>
            </div>
        </div>

    </div>
</nav>

<!-- ========== SECCIÓN DE PROYECTOS ========== -->
<!-- py-5: espacio arriba y abajo de la sección.
     seccion-proyectos: mi clase para esta sección -->
<section class="py-5 seccion-proyectos">
    <!-- container-fluid: el contenido ocupa todo el ancho de la pantalla -->
    <div class="container-fluid">
        <!-- Contenedor de todas las tarjetas, las acomoda una al lado de la otra -->
        <div class="galeria-proyectos">

            <!-- La clase tarjeta-proyecto-activa marca cuál está abierta.
                 Solo una tarjeta debe llevarla -->
             <article class="tarjeta-proyecto">
                <img src="assets/Proyectos/MARS/PHOTO-2026-10-03-15-44-17.jpg" alt="Descripción del proyecto 3">
                <span class="anio-proyecto">2026</span>
            </article>


            <article class="tarjeta-proyecto">
                <img src="assets/Proyectos/TALENTLAND/IMG_0036.jpg" alt="Descripción del proyecto 2">
                <span class="anio-proyecto">2026</span>
            </article>

             <article class="tarjeta-proyecto tarjeta-proyecto-activa">
                <img src="assets/Proyectos/NASASPACEAPPS/images (1).png" alt="Descripción del proyecto 1">
                <span class="anio-proyecto">2025</span>
            </article>



            <article class="tarjeta-proyecto tarjeta-proyecto-activa">
                <img src="assets/Proyectos/NASASPACEAPPS/images (1).png" alt="Descripción del proyecto 1">
                <span class="anio-proyecto">2025</span>
            </article>

        </div>
    </div>
</section>

<!-- JavaScript de Bootstrap. Es el que hace funcionar el botón de hamburguesa.
     Va al final del body para que la página se vea antes de cargarlo -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Mi JavaScript. Es el que abre y cierra las tarjetas al darles clic.
     Va después del de Bootstrap y al final del body para que la página
     ya esté cargada cuando se ejecute -->
<script src="js/proyectos.js"></script>
</body>
</html>
